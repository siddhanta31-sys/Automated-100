services:
  - type: web
    name: trend2sketch-studio
    runtime: docker
    plan: standard
    healthCheckPath: /
    disk:
      name: trend2sketch-studio-data
      mountPath: /var/data
      sizeGB: 20
    envVars:
      - key: TREND2SKETCH_DATA_DIR
        value: /var/data/trend2sketch-studio
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_VISION_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: OPENAI_IMAGE_QUALITY
        value: low
      - key: AUTO_INTERVAL_MINUTES
        value: '30'
      - key: AUTO_RUN_ON_START
        value: 'true'
      - key: CONCEPT_POOL_SIZE
        value: '300'
      - key: MAX_RENDER_PER_CYCLE
        value: '30'
      - key: DISPLAY_THRESHOLD
        value: '95'
      - key: GENERATION_CONCURRENCY
        value: '3'
      - key: DAILY_API_BUDGET_USD
        value: '10'
      - key: EST_IMAGE_COST_USD
        value: '0.03'
      - key: RETENTION_DAYS
        value: '30'
      - key: APP_PUBLIC_URL
        sync: false
